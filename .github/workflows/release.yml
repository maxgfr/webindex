name: Release

# Conventional-Commit-driven releases, fully in CI. On every push to `main`,
# semantic-release inspects the commits since the last release and, when they
# warrant one (feat → minor, fix → patch, `!`/BREAKING → major):
#   - runs the full gate (typecheck / lint / test / reproducible bundle),
#   - computes the next version, syncs it across package.json / src/version.ts /
#     CHANGELOG.md and rebuilds the bundle (scripts/sync-version.mjs),
#   - commits the bump AND the rebuilt bundle back to `main`,
#   - tags `v<version>` and creates the GitHub release.
#
# The bundle must be committed, not merely attached: consumers fetch it from
# raw.githubusercontent.com at the pinned tag (see each skill's
# scripts/sync-engine.mjs), so a tag whose tree lacks the built engine is a tag
# nobody can vendor. It is also attached to the release for convenience.
#
# No npm-registry publish (GitHub release only) — uses the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
  # Runnable by hand, for a release that needs re-driving after a transient
  # failure. Safe to repeat: semantic-release analyses the commits since the
  # last tag and publishes nothing when none of them warrant a release.
  workflow_dispatch:

permissions:
  contents: write # push the bump commit + tag, create the release
  issues: write # semantic-release comments on released issues/PRs
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags, required to analyze commits since last release
          persist-credentials: true # let @semantic-release/git push the bump commit

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate — typecheck / lint / test / reproducible bundle
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run check:build

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
