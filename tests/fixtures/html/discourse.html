<div id="topic-title"><h1><a href="/t/why-does-my-token-bucket-drift/1234">Why does my token bucket drift?</a></h1></div>
<div itemscope itemtype="http://schema.org/DiscussionForumPosting">
<div class="topic-body crawler-post"><div class="crawler-post-meta"><span class="creator" itemprop="author"><a href="/u/alice"><span itemprop="name">alice</span></a></span></div>
<div class="post" itemprop="text"><p>I implemented a token bucket with a refill rate of 10 tokens per second, but after a few hours it allows about 11 requests per second. I am using setInterval to add one token every 100 ms. What am I doing wrong?</p></div></div>
<div class="topic-body crawler-post"><div class="crawler-post-meta"><span class="creator"><a href="/u/bob"><span itemprop="name">bob</span></a></span></div>
<div class="post" itemprop="text"><p>setInterval is not a clock. Compute the tokens lazily on each request from the elapsed monotonic time, cap at the bucket size, and store the refill timestamp. Then drift is impossible.</p></div></div>
</div>
